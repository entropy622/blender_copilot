name: Build Blender add-on
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/package_addon.py
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c "import os,pathlib; assert pathlib.Path('dist/blender_copilot-'+os.environ['RELEASE_TAG'].removeprefix('v')+'.zip').is_file(), 'Tag must match bl_info version'"
      - uses: actions/upload-artifact@v4
        with:
          name: blender-copilot-addon
          path: dist/*.zip
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.zip --verify-tag --draft --generate-notes
